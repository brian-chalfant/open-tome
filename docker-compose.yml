name: open-tome

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       tome_app
      POSTGRES_USER:     tome_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - internal
    expose:
      - "5432"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tome_app -d tome_app"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: chalfeezy/open-tome-backend:latest
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://tome_app:${POSTGRES_PASSWORD}@postgres:5432/tome_app
    networks:
      - internal
    expose:
      - "3001"
    ports:
      - "127.0.0.1:3002:3002"
    volumes:
      - backup-data:/backups:ro
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
      - seccomp:./docker/chrome-seccomp.json
    restart: unless-stopped

  frontend:
    image: chalfeezy/open-tome-frontend:latest
    build:
      context: ./client
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "127.0.0.1:5137:80"
    networks:
      - internal
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/run
      - /var/cache/nginx
      - /var/log/nginx
      - /usr/share/nginx/html
    restart: unless-stopped

  backup:
    image: chalfeezy/open-tome-backup:latest
    build:
      context: ./docker/backup
      dockerfile: Dockerfile
    environment:
      PGHOST:            postgres
      PGPORT:            "5432"
      PGDATABASE:        tome_app
      PGUSER:            tome_app
      PGPASSWORD:        ${POSTGRES_PASSWORD}
      BACKUP_DIR:        /backups
      BACKUP_RETAIN_DAYS: "30"
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
    volumes:
      - backup-data:/backups
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  pg-data:
  backup-data:
